name: Omarchy desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The bundled FFmpeg links against these; the slimmer ARM runner image lacks them.
      - name: FFmpeg runtime libraries (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libva2 libva-drm2 libdrm2 libpulse0 libxcb1 libxcb-shm0
      - name: Installer checks
        run: |
          bash -n scripts/omarchy
          python3 -m unittest discover -s scripts/tests -v
      - name: Build and test without Android
        run: ./scripts/omarchy build
      - name: Preserve executable permissions in archive
        run: tar -czf BitChord-Omarchy-linux-${{ matrix.arch }}.tar.gz -C desktopApp/build/compose/binaries/main/app BitChord
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Omarchy-linux-${{ matrix.arch }}
          path: BitChord-Omarchy-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
